# ============================================================================
# CLIP feature cache extraction config for D2ST UCF101 experiments.
#
# Use with:
#   python tools/extract_fs_features.py \
#     --cfg config/frame_selector/ucf101_bimhm_cache.yaml \
#     --splits train,val,test
#
# Cache should include train/val/test because the few-shot eval loader can
# request test-time cached features.
# ============================================================================

OUTPUT_DIR: output/frame_selector/ucf101_bimhm_cache

FRAME_SELECTOR:
  ENABLE: true
  BACKBONE_NAME: "ViT-B/16"
  TOTAL_FRAMES: 32
  SELECT_FRAMES: 8
  SEGMENTS: 4
  FEAT_DIM: 0

DATA:
  DATA_ROOT_DIR: /mnt/data/yanyi2025/lrc/action_data/ucf101/
  ANNO_DIR: ./config/ucf101/
  TRAIN_LIST: train_few_shot.txt
  VAL_LIST: val_few_shot.txt
  TEST_LIST: test_few_shot.txt
  FILE_EXTENSION: ".avi"
  BATCH_SIZE: 8
  VAL_BATCH_SIZE: 8
  NUM_WORKERS: 4
  TRAIN_CROP_SIZE: 224
  TRAIN_JITTER_SCALES: [256, 256]
  USE_AUG: false
  MEAN: [0.48145466, 0.4578275, 0.40821073]
  STD: [0.26862954, 0.26130258, 0.27577711]
  FEAT_CACHE:
    CACHE_DIR: data/feat_cache/ucf101

LOG_PERIOD: 50
SAVE_PERIOD: 5
NUM_GPUS: 1
