# ============================================================================
# Bi-MHM Frame Selector pretraining for D2ST HMDB51
# ============================================================================

_BASE: ../OTAM_base.yaml
TASK_TYPE: few_shot_action
RANDOM_SEED: 18
SUPPORT_SHOT: 1

TRAIN:
  ENABLE: true
  USE_CLASSIFICATION_VALUE: 2.5
  NUM_CLASS: 31
  DATASET: HMDB51
  META_BATCH: true
  WAY: 5
  SHOT: 1
  QUERY_PER_CLASS: 1
  QUERY_PER_CLASS_TEST: 1
  NUM_TRAIN_TASKS: 3000
  NUM_TEST_TASKS: 10000
  VAL_FRE_ITER: 1500
  BATCH_SIZE: 2
  BATCH_SIZE_PER_TASK: 8
  CHECKPOINT_FILE_PATH: ""
  EVAL_PERIOD: 2
  NUM_FOLDS: 1
  USE_KEYFRAME_SELECTION: true

AUGMENTATION:
  COLOR_AUG: false
  NO_RANDOM_ERASE: true
  SUPPORT_QUERY_DIFF: true

TEST:
  ENABLE: true
  DATASET: HMDB51
  SHOT: [1, 5]
  BATCH_SIZE: 2
  TEST_SET: val
  NUM_ENSEMBLE_VIEWS: 1
  SPATIAL_CROPS: cctltr
  AUTOMATIC_MULTI_SCALE_TEST: false
  UPLOAD_CLASSIFIER_RESULTS: true
  USE_KEYFRAME_SELECTION: true

DATA:
  DATA_ROOT_DIR: data/hmdb51/
  ANNO_DIR: config/hmdb51/
  TRAIN_LIST: train_few_shot.txt
  VAL_LIST: val_few_shot.txt
  FILE_EXTENSION: ".avi"

  NUM_INPUT_FRAMES: 8
  SAMPLING_RATE: 50
  SAMPLING_UNIFORM: false
  SAMPLING_METHOD: "otam_anchor_keyframe"
  TRAIN_JITTER_SCALES: [256, 256]
  MEAN: [0.48145466, 0.4578275, 0.40821073]
  STD: [0.26862954, 0.26130258, 0.27577711]
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 224
  TEST_SCALE: 256
  TEST_CENTER_CROP: true
  CLIP_INTERVAL: 8
  FPS: 12
  TARGET_FPS: 12
  BATCH_SIZE: 8
  VAL_BATCH_SIZE: 8
  NUM_WORKERS: 4
  USE_AUG: false

  FEAT_CACHE:
    ENABLE: true
    CACHE_DIR: data/feat_cache/hmdb51
    AUTO_REBUILD: false

FRAME_SELECTOR:
  ENABLE: true
  TYPE: bimhm
  BACKBONE_NAME: "ViT-B/16"
  TOTAL_FRAMES: 32
  SELECT_FRAMES: 8
  SEGMENTS: 4
  FEAT_DIM: 0
  STE_TAU: 0.5

LOSS:
  NAME: bimhm_match_aware
  MARGIN: 0.3
  TEMPERATURE: 1.0
  TRIPLET_WEIGHT: 1.0
  CLASS_CE_WEIGHT: 1.0
  MATCH_WEIGHT: 0.5
  MATCH_NORMALIZE_TARGETS: true
  NORMALIZE_BY_FRAMES: false
  CLASS_BALANCED_BATCH: true
  CLASSES_PER_BATCH: 4
  SAMPLES_PER_CLASS: 2
  INDEX_COMPACT_WEIGHT: 0.0
  SCORE_MARGIN_WEIGHT: 0.0

SOLVER:
  BASE_LR: 0.001
  OPTIM_METHOD: adamw
  MAX_EPOCH: 30
  WEIGHT_DECAY: 1e-4
  WARMUP_EPOCHS: 3
  LR_POLICY: cosine

LOG_PERIOD: 50
SAVE_PERIOD: 5
NUM_GPUS: 1
