_BASE: ../OTAM_base.yaml
TASK_TYPE: few_shot_action
RANDOM_SEED: 18
SUPPORT_SHOT: 1

TRAIN:
  ENABLE: true
  NUM_CLASS: 70
  DATASET: UCF101
  META_BATCH: true
  WAY: 5
  SHOT: 1
  QUERY_PER_CLASS: 1
  QUERY_PER_CLASS_TEST: 1
  NUM_TRAIN_TASKS: 18000
  NUM_TEST_TASKS: 10000
  VAL_FRE_ITER: 6000
  BATCH_SIZE: 1
  BATCH_SIZE_PER_TASK: 16
  CHECKPOINT_FILE_PATH: ""
  AUTO_RESUME: false
  EVAL_PERIOD: 2
  NUM_FOLDS: 1
  EARLY_STOP:
    ENABLE: true
    PATIENCE: 0
    MIN_DELTA: 0.05

AUGMENTATION:
  COLOR_AUG: false
  NO_RANDOM_ERASE: true
  SUPPORT_QUERY_DIFF: true

TEST:
  ENABLE: true
  DATASET: UCF101
  SHOT: [1, 5]
  BATCH_SIZE: 1
  EPISODE_SEED: 2026
  TEST_SET: val
  NUM_ENSEMBLE_VIEWS: 1
  SPATIAL_CROPS: cctltr
  AUTOMATIC_MULTI_SCALE_TEST: false
  UPLOAD_CLASSIFIER_RESULTS: true

DATA:
  DATA_ROOT_DIR: /mnt/data/yanyi2025/lrc/action_data/ucf101/
  ANNO_DIR: config/ucf101/
  NUM_INPUT_FRAMES: 8
  SAMPLING_RATE: 50
  SAMPLING_UNIFORM: false
  TRAIN_JITTER_SCALES: [256, 256]
  MEAN: [0.48145466, 0.4578275, 0.40821073]
  STD: [0.26862954, 0.26130258, 0.27577711]
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 224
  TEST_SCALE: 256
  TEST_CENTER_CROP: true
  CLIP_INTERVAL: 8
  FPS: 12
  TARGET_FPS: 12

FOCUS:
  ENABLE: true
  HEADS: 8
  DROPOUT: 0.1
  GATE_INIT: -4.0
  TEMPORAL_GATE_INIT: -4.0
  ALPHA_INIT: -4.0

LOG_PERIOD: 200
SOLVER:
  BASE_LR: 0.00025
  LR_POLICY: steps_with_relative_lrs
  STEPS_ITER: 1800
  STEPS: [0, 5, 7, 9]
  LRS: [1, 0.1, 0.05, 0.01]
  MAX_EPOCH: 10
  MOMENTUM: 0.9
  WEIGHT_DECAY: 5e-4
  WARMUP_EPOCHS: 1
  WARMUP_START_LR: 0.00005
  OPTIM_METHOD: adam
  DAMPENING: 0.0
  NESTEROV: true

OPTIMIZER:
  WEIGHT_DECAY: 5e-3

ADAPTER:
  NAME: ViT_CLIP
  PRETRAINED: ViT-B/16
  WIDTH: 768
  PATCH_SIZE: 16
  LAYERS: 12
  HEADS: 12
  ADAPTER_SCALE: 0.25

INIT_METHOD: tcp://localhost:1111
NUM_GPUS: 1
CUDA_VISIBLE_DEVICES: "0"
OUTPUT_DIR: output/UCF101_FOCUS_v2
